<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trivia Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section id="start-screen" class="card">
        <h1>Trivia Game</h1>
        <p>Teste seus conhecimentos e marque pontos.</p>
        <button id="start-btn">Começar</button>
      </section>

      <section id="game-screen" class="card hidden">
        <div class="topbar">
          <span id="question-counter"></span>
          <span id="score">Pontuação: 0</span>
        </div>

        <h2 id="question-text"></h2>

        <div id="answers" class="answers"></div>

        <button id="next-btn" class="hidden">Próxima</button>
      </section>

      <section id="result-screen" class="card hidden">
        <h1>Fim de Jogo</h1>
        <p id="result-text"></p>
        <button id="restart-btn">Jogar novamente</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
